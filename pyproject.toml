[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "remarkable-ai"
version = "0.1.0"
description = "Wireless AI Assistant, Multi-Device Manager, and Agent Slash Commands for reMarkable Tablets"
readme = "README.md"
authors = [
  { name = "Kaveh Khoshkhah", email = "khoshkhah@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "rmscene>=0.8.0",
    "paramiko>=3.0.0",
    "pillow>=10.0.0",
    "svgwrite>=1.4.3",
    "cairosvg>=2.7.0",
    "google-genai>=2.0.0",
]

[project.scripts]
rm-ai = "rm_ai:main"

[tool.setuptools]
py-modules = ["rm_ai"]

[project.urls]
Homepage = "https://github.com/Khoshkhah/remarkable-ai"
Repository = "https://github.com/Khoshkhah/remarkable-ai.git"

